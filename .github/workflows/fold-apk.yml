        run: |
          python3 - <<'PY'
          import base64, zlib, os, hashlib, pathlib
          patch = zlib.decompress(base64.b64decode(os.environ['FOLD_PATCH']))
          assert hashlib.sha256(patch).hexdigest() == '1124b5b3b5027dec4a444797a2bf55271bd5a3436b52ffd4bd423bd8c960aef8'
          pathlib.Path('/tmp/controller.patch').write_bytes(patch)
          PY
          if git apply --check /tmp/controller.patch; then
            git apply /tmp/controller.patch
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add app tests
            git commit -m 'Refresh docked controller layout and remove keyboard button'
            git push origin HEAD:"$GITHUB_REF_NAME"
          else
            git apply --reverse --check /tmp/controller.patch
          fi
      - name: Check controller spacing and stream sizing
        run: |
          javac -d /tmp/layout-check app/src/main/java/com/limelight/ui/DockedStreamGeometry.java app/src/main/java/com/limelight/binding/input/virtual_controller/DockedControllerLayout.java tests/DockedStreamGeometryCheck.java tests/DockedControllerLayoutCheck.java
          java -cp /tmp/layout-check DockedStreamGeometryCheck
          java -cp /tmp/layout-check DockedControllerLayoutCheck
      - name: Build test APK
        run: ./gradlew :app:assembleNonRootDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: Moonlight-Fold-Controller-v2
          path: app/build/outputs/apk/nonRoot/debug/*.apk
      - name: Lint
        run: ./gradlew :app:lintNonRootDebug --console=plain
