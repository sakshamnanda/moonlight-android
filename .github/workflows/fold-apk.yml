          import base64, zlib, os, hashlib, pathlib
          patch = zlib.decompress(base64.b64decode(os.environ['FOLD_PATCH']))
          assert hashlib.sha256(patch).hexdigest() == 'd2e88f1fa4e6b5887db02ed664fba3dcf8e7a5fafc079497a2b9148c34464a9f'
