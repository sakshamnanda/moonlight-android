        run: |
          python3 - <<'PYCODE'
          import os, base64, zlib, hashlib, pathlib
          patch = zlib.decompress(base64.b64decode(os.environ['FOLD_PATCH']))
          assert hashlib.sha256(patch).hexdigest() == '9bbd995ca9672990fdc30cf3a5ceee47125dbcf4179327beaea535aad78ca14b'
          pathlib.Path('/tmp/fold4.patch').write_bytes(patch)
          PYCODE
          if git apply --check /tmp/fold4.patch; then
            git apply /tmp/fold4.patch
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add app tests third_party tools
            git commit -m 'Fit PC keyboard to dock and announce on-screen Xbox controller on connect'
            git push origin "HEAD:$GITHUB_REF_NAME"
          else
            git apply --reverse --check /tmp/fold4.patch
          fi
      - name: Check keyboard input and dock geometry
        run: |
          python3 tools/import_hacker_keyboard.py
          git diff --exit-code -- app/src/main/assets/hackerskeyboard
          mkdir -p /tmp/fold-checks
          javac -d /tmp/fold-checks app/src/main/java/com/limelight/ui/KeyboardKeyState.java app/src/main/java/com/limelight/ui/GamingKeyboardGeometry.java app/src/main/java/com/limelight/ui/DockedStreamGeometry.java app/src/main/java/com/limelight/binding/input/virtual_controller/DockedControllerLayout.java tests/KeyboardKeyStateCheck.java tests/GamingKeyboardGeometryCheck.java tests/DockedStreamGeometryCheck.java tests/DockedControllerLayoutCheck.java
          java -cp /tmp/fold-checks KeyboardKeyStateCheck
          java -cp /tmp/fold-checks GamingKeyboardGeometryCheck
          java -cp /tmp/fold-checks DockedStreamGeometryCheck
          java -cp /tmp/fold-checks DockedControllerLayoutCheck
      - name: Build APK
        run: ./gradlew assembleNonRootDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Moonlight-Fold-Keyboard-Controller-v4
          path: app/build/outputs/apk/nonRoot/debug/*.apk
      - name: Lint
        run: ./gradlew lintNonRootDebug
