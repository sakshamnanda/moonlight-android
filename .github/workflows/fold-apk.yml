        run: |
          javac -d /tmp/dock-check app/src/main/java/com/limelight/ui/DockedStreamGeometry.java tests/DockedStreamGeometryCheck.java
          java -cp /tmp/dock-check DockedStreamGeometryCheck
      - name: Build test APK
        run: ./gradlew :app:assembleNonRootDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: Moonlight-Fold-Test-APK
          path: app/build/outputs/apk/nonRoot/debug/*.apk
      - name: Lint
        run: ./gradlew :app:lintNonRootDebug --console=plain
