          PY
          if git apply --check /tmp/fold7.patch; then
            git apply /tmp/fold7.patch
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add app tests
            git commit -m 'Enlarge docked sticks and add persistent D-pad position swap'
            git push origin HEAD:"$GITHUB_REF_NAME"
          else
            git apply --reverse --check /tmp/fold7.patch
          fi
      - name: Check keyboard assets and input geometry
        run: |
          python3 tools/import_hacker_keyboard.py
          git diff --exit-code -- app/src/main/assets/hackerskeyboard
          javac -d /tmp/fold-checks app/src/main/java/com/limelight/ui/GamingKeyboardGeometry.java app/src/main/java/com/limelight/ui/DockedStreamGeometry.java app/src/main/java/com/limelight/ui/KeyboardKeyState.java app/src/main/java/com/limelight/binding/input/virtual_controller/DockedControllerLayout.java tests/GamingKeyboardGeometryCheck.java tests/DockedStreamGeometryCheck.java tests/KeyboardKeyStateCheck.java tests/DockedControllerLayoutCheck.java
          java -cp /tmp/fold-checks GamingKeyboardGeometryCheck
          java -cp /tmp/fold-checks DockedStreamGeometryCheck
          java -cp /tmp/fold-checks KeyboardKeyStateCheck
          java -cp /tmp/fold-checks DockedControllerLayoutCheck
      - name: Build test APK
        run: ./gradlew :app:assembleNonRootDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: Moonlight-Fold-Controller-v7
          path: app/build/outputs/apk/nonRoot/debug/*.apk
      - name: Lint
        run: ./gradlew :app:lintNonRootDebug --console=plain
