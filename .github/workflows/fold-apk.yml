          java -cp /tmp/fold-checks DockedStreamGeometryCheck
          java -cp /tmp/fold-checks KeyboardKeyStateCheck
          java -cp /tmp/fold-checks DockedControllerLayoutCheck
      - name: Build test APK
        run: ./gradlew :app:assembleNonRootDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: Moonlight-Fold-Keyboard-v5
          path: app/build/outputs/apk/nonRoot/debug/*.apk
      - name: Lint
        run: ./gradlew :app:lintNonRootDebug --console=plain
