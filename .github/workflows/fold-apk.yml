name: Fold keyboard APK
on:
  workflow_dispatch:
  push:
    branches: [feature/fold-docked-controls]
    paths: [.github/workflows/fold-apk.yml]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Publish reviewed keyboard integration
        env:
          FOLD_PATCH: >-
            eNqtk81u4yAUhfc8xZU3JIqNY49jp5WiZtP9LLqbjCIM1zETDBYQTauq7z64adSfTTWdYWHg07nmco6Qqusgyw4qAM/5OObe
            iXzgyuTceww+77k4ovNHfGgtdzI/tnLfnbRmv7w10P59DVFG4j1Uay5k03LGrsqy4oUQUCyXdVWRLMu+0gtZLBZf6me7hexb
            vUobWJyn7ZbANJ7S8/x4ngASzVvUyTUkeZKS7AX2yoSJ7XY3kS4+0IldyoWVGFlTvyLfq27SdVx7fMW/UR36iTesqMr1qimq
            9YrIt2EFa7XP1TBaF/bnG+4vN2TjQ7TiE8VLEKVYletyWTBWLOurZSXl+yA++8vZ9s9Uk8nNZHHzbDB0zg4w8tBr1cK5DL7H
            Lbls7gfNMDhEdqtxQBPu4hq4h9s7AgS8PTmBsHkumtHQKyf3I3fh4WPadE4yH5wyBx/lj8h4iLv2BzV8QPrzGmbIAt4HsA4o
            nTOHo+YCZ3S329IU6PY9SyaWvGExd5qkkNDknS7SKIzfOVn8x+NvJnbzzy3Bm9HFkxGUic6y6KDH2Yu5OVBpjY39cuM1D5hF
            Twc+sphNPO0Q47E2zOZPBMx0OfrYhzBe57kXPQ7cM26ks0oyYYf4Lo+5Q5/xU7BPNAY4olBcxzKpRJgF3m7qIgWH4eTMflPX
            aZTExjd1GVfTK9msrlKQqDFE2KTkD7ugeA8=
        run: |
          python3 - <<'PYCODE'
          import os, base64, zlib, hashlib, pathlib
          patch = zlib.decompress(base64.b64decode(os.environ['FOLD_PATCH']))
          assert hashlib.sha256(patch).hexdigest() == 'be38fbde7b7a67028cef801d98adc8974fd20585a3c4d41de57de5099cab9685'
          pathlib.Path('/tmp/keyboard.patch').write_bytes(patch)
          PYCODE
          if git apply --check /tmp/keyboard.patch; then
            git apply /tmp/keyboard.patch
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add app tests third_party tools
            git commit -m "Decode escaped question-mark label in imported keyboard"
            git push origin "HEAD:$GITHUB_REF_NAME"
          else
            git apply --reverse --check /tmp/keyboard.patch
          fi
      - name: Check keyboard input and dock geometry
        run: |
          python3 tools/import_hacker_keyboard.py
          git diff --exit-code -- app/src/main/assets/hackerskeyboard
          mkdir -p /tmp/fold-checks
          javac -d /tmp/fold-checks app/src/main/java/com/limelight/ui/KeyboardKeyState.java app/src/main/java/com/limelight/ui/DockedStreamGeometry.java app/src/main/java/com/limelight/binding/input/virtual_controller/DockedControllerLayout.java tests/KeyboardKeyStateCheck.java tests/DockedStreamGeometryCheck.java tests/DockedControllerLayoutCheck.java
          java -cp /tmp/fold-checks KeyboardKeyStateCheck
          java -cp /tmp/fold-checks DockedStreamGeometryCheck
          java -cp /tmp/fold-checks DockedControllerLayoutCheck
      - name: Build APK
        run: ./gradlew assembleNonRootDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Moonlight-Fold-Keyboard-v3
          path: app/build/outputs/apk/nonRoot/debug/*.apk
      - name: Lint
        run: ./gradlew lintNonRootDebug
