          fi
      - name: Check keyboard assets and input geometry
        run: |
          python3 tools/import_hacker_keyboard.py
          git diff --exit-code -- app/src/main/assets/hackerskeyboard
          javac -d /tmp/fold-checks app/src/main/java/com/limelight/ui/GamingKeyboardGeometry.java app/src/main/java/com/limelight/ui/DockedStreamGeometry.java app/src/main/java/com/limelight/ui/KeyboardKeyState.java app/src/main/java/com/limelight/binding/input/virtual_controller/DockedControllerLayout.java tests/GamingKeyboardGeometryCheck.java tests/DockedStreamGeometryCheck.java tests/KeyboardKeyStateCheck.java tests/DockedControllerLayoutCheck.java
